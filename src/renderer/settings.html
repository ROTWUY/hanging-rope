<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>悬挂绳 · 设置</title>
  <link rel="stylesheet" href="settings.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="hd">
      <h1>设置</h1>
    </header>

    <main>
      <section class="card">
        <h2>外观</h2>

        <div class="row">
          <div class="k">
            <span>主题</span>
            <small>浅色 / 深色，切换后立即生效并记住选择</small>
          </div>
          <div class="v">
            <div class="theme-picker" role="group" aria-label="界面主题">
              <button id="btn-theme-light" class="btn theme-opt" data-theme-value="light" aria-pressed="true"><span class="sw sw-light"></span>浅色</button>
              <button id="btn-theme-dark" class="btn theme-opt" data-theme-value="dark" aria-pressed="false"><span class="sw sw-dark"></span>深色</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>图片缓存</h2>

        <div class="row stack">
          <div class="k">
            <span>缓存位置</span>
            <small>悬挂的图片副本存在这里，原图不动</small>
          </div>
          <div class="v">
            <span id="cache-dir" class="path" title=""></span>
            <button id="btn-choose-dir" class="btn">更换…</button>
          </div>
        </div>

        <div class="row">
          <div class="k">
            <span>缓存上限</span>
            <small>超出后只提示，不会自动删掉你的原图</small>
          </div>
          <div class="v">
            <div class="num">
              <input id="limit-input" type="number" min="10" max="4096" step="10" aria-label="缓存上限（MB）">
              <span>MB</span>
            </div>
            <button id="btn-save-limit" class="btn">保存</button>
          </div>
        </div>

        <div class="row">
          <div class="k">
            <span>当前占用</span>
            <small id="cache-usage">—</small>
          </div>
          <div class="v">
            <div class="bar"><i id="usage-bar"></i></div>
            <button id="btn-prune" class="btn">清理未引用</button>
            <button id="btn-clear-cache" class="btn danger">清空缓存</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>悬挂绳</h2>

        <div class="row">
          <div class="k">
            <span>停靠位置</span>
            <small id="pos-note">绳子贴在哪条屏幕边缘，切换后立即生效并记住</small>
          </div>
          <div class="v">
            <div class="limit-picker" role="group" aria-label="停靠位置">
              <button class="btn seg-opt pos-opt on" data-pos-value="top" aria-pressed="true">顶部</button>
              <button class="btn seg-opt pos-opt" data-pos-value="left" aria-pressed="false">左侧</button>
              <button class="btn seg-opt pos-opt" data-pos-value="right" aria-pressed="false">右侧</button>
              <button class="btn seg-opt pos-opt" data-pos-value="bottom" aria-pressed="false">底部</button>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="k">
            <span>复制即悬挂</span>
            <small>复制文件 / 文字 / 图片后自动挂上绳</small>
          </div>
          <div class="v">
            <kbd id="hotkey-label">Ctrl+Alt+H</kbd>
            <span id="copy-state" class="tag">已关闭</span>
            <button id="btn-toggle-copy" class="btn">切换</button>
          </div>
        </div>

        <div class="row">
          <div class="k">
            <span>绳上挂件</span>
            <small id="item-count">当前 0 件 / 上限 300 件</small>
          </div>
          <div class="v">
            <button id="btn-clear-all" class="btn danger">清空全部挂件</button>
          </div>
        </div>

        <div class="row">
          <div class="k">
            <span>件数上限</span>
            <small id="limit-note">最多挂 300 件，已满时不再添加新挂件</small>
          </div>
          <div class="v">
            <div class="limit-picker" role="group" aria-label="挂件件数上限">
              <button class="btn limit-opt" data-limit-value="200" aria-pressed="false">200</button>
              <button class="btn limit-opt on" data-limit-value="300" aria-pressed="true">300</button>
              <button class="btn limit-opt" data-limit-value="350" aria-pressed="false">350</button>
              <button class="btn limit-opt" data-limit-value="400" aria-pressed="false">400</button>
              <button class="btn limit-opt" data-limit-value="450" aria-pressed="false">450</button>
              <button class="btn limit-opt" data-limit-value="500" aria-pressed="false">500</button>
            </div>
          </div>
        </div>
      </section>
      <section class="card">
        <h2>关于</h2>

        <div class="row">
          <div class="k">
            <span>版本</span>
            <small>悬挂绳 · 常驻屏幕顶端的文件中转站</small>
          </div>
          <div class="v">
            <span id="app-version" class="tag on">—</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="ft">
      <button id="btn-quit" class="btn danger">退出程序</button>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
      <button id="btn-close" class="btn primary">关闭</button>
    </footer>
  </div>

  <script src="settings.js"></script>
</body>
</html>

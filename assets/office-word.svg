<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" aria-label="Word">
  <!-- 仿 Microsoft 365 Word 图标：蓝色渐变叠层 + 左下 W 徽标。
       纯矢量自绘，未使用任何官方素材；不含桌面快捷方式小箭头。 -->
  <defs>
    <linearGradient id="wBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3183f2"/>
      <stop offset="0.52" stop-color="#1857d6"/>
      <stop offset="1" stop-color="#0a33a6"/>
    </linearGradient>
    <linearGradient id="wTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48d0f6"/>
      <stop offset="0.5" stop-color="#5c92f3"/>
      <stop offset="1" stop-color="#a376ee"/>
    </linearGradient>
    <linearGradient id="wBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3369e0"/>
      <stop offset="1" stop-color="#11379b"/>
    </linearGradient>
    <clipPath id="wClip"><rect x="18" y="6" width="68" height="80" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#wClip)">
    <rect x="18" y="6" width="68" height="80" fill="url(#wBase)"/>
    <path d="M18 6 H86 V50 C72 56 60 51 47 43 C34 35 26 32 18 34 Z" fill="url(#wTop)"/>
    <path d="M18 47 C31 49 41 57 53 61 C67 66 77 63 86 59 V72 H18 Z" fill="#0e45c4" opacity="0.55"/>
  </g>
  <rect x="18" y="6" width="68" height="80" rx="16" fill="none" stroke="#0a2f8f" stroke-opacity="0.22"/>
  <rect x="6" y="46" width="42" height="42" rx="10" fill="url(#wBadge)"/>
  <text x="27" y="77" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" aria-label="Excel">
  <!-- 仿 Microsoft 365 Excel 图标：绿色渐变叠层 + 左下 X 徽标。
       纯矢量自绘，未使用任何官方素材；不含桌面快捷方式小箭头。 -->
  <defs>
    <linearGradient id="eBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15924a"/>
      <stop offset="1" stop-color="#07532a"/>
    </linearGradient>
    <linearGradient id="eTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45c963"/>
      <stop offset="1" stop-color="#15974a"/>
    </linearGradient>
    <linearGradient id="eLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ec79"/>
      <stop offset="1" stop-color="#62d35d"/>
    </linearGradient>
    <linearGradient id="eBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1da251"/>
      <stop offset="1" stop-color="#0a652f"/>
    </linearGradient>
    <clipPath id="eClip"><rect x="18" y="6" width="68" height="80" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#eClip)">
    <rect x="18" y="6" width="68" height="80" fill="url(#eBase)"/>
    <path d="M18 6 H52 V60 Q52 68 44 68 H18 Z" fill="url(#eTop)"/>
    <rect x="52" y="6" width="34" height="34" rx="14" fill="url(#eLight)"/>
  </g>
  <rect x="18" y="6" width="68" height="80" rx="16" fill="none" stroke="#064a26" stroke-opacity="0.22"/>
  <rect x="6" y="46" width="42" height="42" rx="10" fill="url(#eBadge)"/>
  <text x="27" y="77" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">X</text>
</svg>
